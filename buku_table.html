{% extends "base.html" %}

{% block content %}
<!-- Begin Page Content -->
<div class="container-fluid">

    <!-- Page Heading -->
    <h1 class="h3 mb-2 text-gray-800">Buku Table</h1>

    <!-- DataTales Example -->
    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                    <thead>
                        <tr>
                            <th>id_buku</th>
                            <th>judul_buku</th>
                            <th>kategori</th>
                            <th>total_halaman</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for data in books %}
                            <tr>
                                <td>{{data.id_buku}}</td>
                                <td> {{data.judul_buku}} </td>
                                <td> {{data.kategori}} </td>
                                <td> {{data.total_halaman}} </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<!-- /.container-fluid -->

</div>
<!-- End of Main Content -->
{% endblock %}
